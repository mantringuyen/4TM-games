		// Standards-safe iOS viewport height normalization and settled resize trigger
		(function () {
			var probe = document.createElement('div');
			probe.id = 'gd-vh-probe';
			probe.style.cssText = 'position:fixed;top:0;bottom:0;left:0;right:0;pointer-events:none;visibility:hidden;z-index:-9999;';
			var ins = document.createElement('div');
			ins.id = 'gd-ins-probe';
			ins.style.cssText = 'position:fixed;bottom:0;left:0;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);pointer-events:none;visibility:hidden;z-index:-9999;';
			function getEffectiveHeight() {
				var isStandalone = !!(window.navigator && window.navigator.standalone) || (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
				var isIOS = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
				if (isStandalone && isIOS && window.screen) {
					var isLandscape = (window.orientation === 90 || window.orientation === -90);
					return isLandscape ? Math.min(window.screen.width, window.screen.height) : Math.max(window.screen.width, window.screen.height);
				}
				var probeH = probe.offsetHeight || (probe.getBoundingClientRect ? probe.getBoundingClientRect().height : 0);
				var winH = window.innerHeight || 0;
				var docH = document.documentElement ? document.documentElement.clientHeight || 0 : 0;
				var vvH = (window.visualViewport && window.visualViewport.height) ? window.visualViewport.height : 0;
				return Math.max(probeH, winH, docH, vvH);
			}
			function syncViewport() {
				var h = getEffectiveHeight();
				if (h > 0) {
					document.documentElement.style.height = h + 'px';
					document.body.style.height = h + 'px';
					var cv = document.getElementById('canvas');
					if (cv) cv.style.height = h + 'px';
				}
			}
			function triggerSettledResize() {
				syncViewport();
				[50, 150, 300, 500, 1000].forEach(function (delay) {
					setTimeout(function () {
						syncViewport();
						window.dispatchEvent(new Event('resize'));
					}, delay);
				});
			}
			if (document.body) {
				document.body.appendChild(probe);
				document.body.appendChild(ins);
			} else {
				document.addEventListener('DOMContentLoaded', function () {
					document.body.appendChild(probe);
					document.body.appendChild(ins);
					triggerSettledResize();
				});
			}
			window.addEventListener('resize', syncViewport);
			window.addEventListener('orientationchange', triggerSettledResize);
			triggerSettledResize();
			// Diagnostics HUD for verification
			var diagEvents = [];
			window.__4TM_RECORD_ERROR__ = function (type, detail, extra) {
				diagEvents.push({ time: Date.now(), type: 'error:' + type, detail: detail, extra: extra });
				if (window.__4TM_UPDATE_DIAG_UI__) window.__4TM_UPDATE_DIAG_UI__();
			};
			window.__4TM_RECORD_MILESTONE__ = function (milestone, detail) {
				diagEvents.push({ time: Date.now(), type: 'milestone:' + milestone, detail: detail });
				if (window.__4TM_UPDATE_DIAG_UI__) window.__4TM_UPDATE_DIAG_UI__();
			};
			function createDiagUI() {
				var isDev = location.hostname.indexOf('dev') !== -1 || location.search.indexOf('diag=1') !== -1;
				if (!isDev) return;
				var ui = document.createElement('div');
				ui.id = 'gd-diag-hud';
				ui.style.cssText = 'position:fixed;bottom:env(safe-area-inset-bottom,0px);left:0;right:0;max-height:180px;background:rgba(9,9,11,0.85);backdrop-filter:blur(6px);color:#e4e4e7;font-family:monospace;font-size:11px;line-height:1.4;padding:6px 10px;z-index:99999;border-top:1px solid #27272a;display:none;';
				var header = document.createElement('div');
				header.style.cssText = 'display:flex;justify-content:space-between;align-items:center;font-weight:bold;margin-bottom:4px;';
				header.innerHTML = '<span>[4TM-DIAG] Diagnostics HUD</span><span style="cursor:pointer;color:#a1a1aa;padding:0 4px;" onclick="this.parentNode.parentNode.style.display=\'none\'">&times;</span>';
				var details = document.createElement('div');
				details.id = 'gd-diag-content';
				ui.appendChild(header);
				ui.appendChild(details);
				document.body.appendChild(ui);
				window.__4TM_UPDATE_DIAG_UI__ = updateHUD;
				updateHUD();
				function formatTime(ms) {
					var d = new Date(ms);
					return d.toTimeString().split(' ')[0] + '.' + ('00' + d.getMilliseconds()).slice(-3);
				}
				function formatDetailStr(detail) {
					if (!detail) return '';
					if (typeof detail === 'object') {
						try { return ' ' + JSON.stringify(detail); } catch (e) { return ' ' + String(detail); }
					}
					return ' ' + String(detail);
				}
				function updateHUD() {
					var hasErrors = diagEvents.some(function (e) { return e.type.indexOf('error:') === 0; });
					if (hasErrors || location.search.indexOf('diag=1') !== -1) {
						ui.style.display = 'block';
					}
					var html = '<div>';
					html += '<span style="color:#a1a1aa;">Viewport:</span> ' + window.innerWidth + '&times;' + window.innerHeight + ' | ';
					html += '<span style="color:#a1a1aa;">Effective:</span> ' + getEffectiveHeight() + 'px | ';
					html += '<span style="color:#a1a1aa;">Standalone:</span> ' + (!!(window.navigator && window.navigator.standalone) || (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches)) + '<br>';
					html += '<details><summary style="color:#60a5fa;cursor:pointer;">Live Events (' + diagEvents.length + ' events)</summary>';
					html += '<div style="max-height:120px;overflow-y:auto;background:#09090b;padding:4px;border-radius:2px;margin-top:2px;font-size:10px;">';
					if (diagEvents.length === 0) {
						html += '<div style="color:#64748b;">(No events yet)</div>';
					} else {
						var baseC = diagEvents[0].time;
					diagEvents.forEach(function (ev) {
						var diff = ev.time - baseC;
						var isM = ev.type.indexOf('milestone:') === 0;
						var isErr = ev.type.indexOf('error:') === 0;
						var col = isErr ? '#ef4444' : (isM ? '#34d399' : '#94a3b8');
						html += '<div style="color:' + col + ';word-break:break-all;">[' + formatTime(ev.time) + ' +' + diff + 'ms] ' + ev.type + formatDetailStr(ev.detail) + '</div>';
					});
					}
					html += '</div></details>';
					html += '</div>';

				details.innerHTML = html;
			}

			if (document.readyState === 'loading') {
				document.addEventListener('DOMContentLoaded', createDiagUI);
			} else {
				createDiagUI();
			}
		}
		}());
		</script>
