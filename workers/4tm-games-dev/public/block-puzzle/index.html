																																																																														<script>
		// Standards-safe iOS viewport height normalization and settled resize trigger
		(function () {
			var probe = document.createElement('div');
			probe.id = 'gd-vh-probe';
			probe.style.cssText = 'position:fixed;top:0;bottom:0;left:0;right:0;pointer-events:none;visibility:hidden;z-index:-9999;';
			var ins = document.createElement('div');
			ins.id = 'gd-ins-probe';
			ins.style.cssText = 'position:fixed;bottom:0;left:0;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);pointer-events:none;visibility:hidden;z-index:-9999;';
			function getEffectiveHeight() {
				if (!probe.parentNode && document.body) {
					document.body.appendChild(probe);
				}
				if (!ins.parentNode && document.body) {
					document.body.appendChild(ins);
				}
				var probeH = probe.offsetHeight || (probe.getBoundingClientRect ? Math.round(probe.getBoundingClientRect().height) : 0);
				var docH = (document.documentElement && document.documentElement.clientHeight) || 0;
				var winH = window.innerHeight || 0;
				var vvH = (window.visualViewport && Math.round(window.visualViewport.height)) || 0;
				var insetBot = 0;
				if (ins) {
					var cs = window.getComputedStyle(ins);
					insetBot = parseFloat(cs.paddingBottom) || 0;
				}
				var isIOS = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
				var isStandalone = !!(window.navigator && window.navigator.standalone) || (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
				var standaloneH = 0;
				if (isStandalone && isIOS && window.screen) {
					var isLand = (window.orientation === 90 || window.orientation === -90);
					standaloneH = isLand ? Math.min(window.screen.width, window.screen.height) : Math.max(window.screen.width, window.screen.height);
				} else if (isStandalone) {
					standaloneH = (winH || 0) + insetBot;
				}
				return Math.max(probeH, docH, winH, vvH, standaloneH);
			}
			function syncViewport() {
				var h = getEffectiveHeight();
				if (h) {
					document.documentElement.style.setProperty('--vh', (h * 0.01) + 'px');
				}
			}
			syncViewport();
			window.addEventListener('resize', syncViewport);
			window.addEventListener('orientationchange', syncViewport);
			// Controlled settling triggers for iOS standalone PWA bottom chin layout
			[100, 250, 500, 1000].forEach(function (delay) {
				setTimeout(function () {
					syncViewport();
					window.dispatchEvent(new Event('resize'));
				}, delay);
			});
		}());
		// Standards-safe iOS viewport diagnostic telemetry, persistence & HUD (?diag=1)
		(function () {
			var isDiagActive = false;
			try {
				var q = window.location.search || '';
				isDiagActive = (new URLSearchParams(q).get('diag') === '1') || q.indexOf('diag=1') !== -1;
			} catch (e) {
				isDiagActive = false;
			}

			var diagEvents = [];
			var diagErrors = [];
			var prevSessionEvents = [];
			var prevSessionErrors = [];
			var prevSessionLastUpdated = 0;
			var sessionCount = 1;
			var webglStats = { lossCount: 0, restoreCount: 0, lastLossTime: 0, lastRestoreTime: 0, isLost: false };
			var currentSessionInitTime = Date.now();
			var lastRecordedMilestoneName = '';
			var lastRecordedMilestoneTime = 0;
			var hbCount = 0;
			var prevHeartbeat = null;

			function hasMilestones(evList) {
				if (!evList || !evList.length) return false;
				for (var i = 0; i < evList.length; i++) {
					if (evList[i].type && evList[i].type.indexOf('milestone:') === 0) return true;
				}
				return false;
			}

			function loadDiagHistory() {
				try {
					var raw = (window.sessionStorage && window.sessionStorage.getItem('__4TM_DIAG_HISTORY__')) ||
					          (window.localStorage && window.localStorage.getItem('__4TM_DIAG_HISTORY__'));
					if (raw) return JSON.parse(raw);
				} catch (e) {}
				return null;
			}

			try {
				var rawHb = (window.sessionStorage && window.sessionStorage.getItem('__4TM_HEARTBEAT__')) ||
				            (window.localStorage && window.localStorage.getItem('__4TM_HEARTBEAT__'));
				if (rawHb) prevHeartbeat = JSON.parse(rawHb);
			} catch (e) {}

			try {
				var hist = loadDiagHistory();
				if (hist && typeof hist === 'object') {
					sessionCount = (hist.sessionCount || 1) + 1;
					var curr = Array.isArray(hist.currentEvents) ? hist.currentEvents : (Array.isArray(hist.events) ? hist.events : []);
					var currErr = Array.isArray(hist.currentErrors) ? hist.currentErrors : (Array.isArray(hist.errors) ? hist.errors : []);
					var prev = Array.isArray(hist.prevEvents) ? hist.prevEvents : [];
					var prevErr = Array.isArray(hist.prevErrors) ? hist.prevErrors : [];

					if (curr.length > 0) {
						if (!hasMilestones(curr) && currErr.length === 0 && (hasMilestones(prev) || prevErr.length > 0)) {
							prevSessionEvents = prev;
							prevSessionErrors = prevErr;
							prevSessionLastUpdated = hist.prevLastUpdated || 0;
						} else {
							prevSessionEvents = curr;
							prevSessionErrors = currErr;
							prevSessionLastUpdated = hist.lastUpdated || 0;
						}
					} else if (prev.length > 0) {
						prevSessionEvents = prev;
						prevSessionErrors = prevErr;
						prevSessionLastUpdated = hist.prevLastUpdated || 0;
					}
				}
			} catch (e) {}

			function saveDiagHistory() {
				try {
					var data = {
							prevEvents: prevSessionEvents,
							prevErrors: prevSessionErrors,
							prevLastUpdated: prevSessionLastUpdated,
							currentEvents: diagEvents,
							currentErrors: diagErrors,
							events: diagEvents,
							errors: diagErrors,
							lastUpdated: Date.now(),
							sessionCount: sessionCount
						};
					if (window.sessionStorage) window.sessionStorage.setItem('__4TM_DIAG_HISTORY__', JSON.stringify(data));
					if (window.localStorage) window.localStorage.setItem('__4TM_DIAG_HISTORY__', JSON.stringify(data));
				} catch (e) {}
			}

			window.setInterval(function () {
				try {
					var now = Date.now();
					var hbObj = {
						time: now,
						count: ++hbCount,
						sessionCount: sessionCount,
						lastMilestone: lastRecordedMilestoneName,
						lastMilestoneTime: lastRecordedMilestoneTime,
						visibility: document.visibilityState
					};
					if (window.sessionStorage) window.sessionStorage.setItem('__4TM_HEARTBEAT__', JSON.stringify(hbObj));
					if (window.localStorage) window.localStorage.setItem('__4TM_HEARTBEAT__', JSON.stringify(hbObj));
				} catch (e) {}
			}, 250);

			function formatTime(ts) {
				try {
					var d = new Date(ts);
					return d.toTimeString().split(' ')[0] + '.' + ('00' + d.getMilliseconds()).slice(-3);
				} catch (e) {
					return String(ts);
				}
			}

			function getTerminationAnalysis() {
				if (!prevSessionEvents || prevSessionEvents.length === 0) {
					return { type: 'NO_PREVIOUS_SESSION', hadUnload: false, lastHeartbeatTime: 0, deltaToInitMs: 0, alivePostMilestoneMs: 0, lastMilestone: null, heartbeatCount: 0 };
				}
				var hadUnload = false;
				for (var i = 0; i < prevSessionEvents.length; i++) {
					var evType = prevSessionEvents[i].type;
					if (evType === 'pagehide' || evType === 'beforeunload' || evType === 'unload') {
						hadUnload = true;
						break;
					}
				}
				var lastPrevM = null;
				for (var j = prevSessionEvents.length - 1; j >= 0; j--) {
					if (prevSessionEvents[j].type && prevSessionEvents[j].type.indexOf('milestone:') === 0) {
						lastPrevM = prevSessionEvents[j];
						break;
					}
				}
				var lastHbTime = (prevHeartbeat && prevHeartbeat.time) ? prevHeartbeat.time : (prevSessionLastUpdated || 0);
				var hbDeltaToInit = currentSessionInitTime - lastHbTime;
				var alivePostMilestone = (lastPrevM && lastHbTime >= lastPrevM.time) ? (lastHbTime - lastPrevM.time) : 0;
				var termType = 'NORMAL_UNLOAD';
				if (!hadUnload) {
					if (prevSessionErrors && prevSessionErrors.length > 0) {
						termType = 'ERROR_BEFORE_TERMINATION';
					} else if (webglStats && webglStats.lossCount > 0) {
						termType = 'WEBGL_CONTEXT_LOSS';
					} else {
						termType = 'SILENT_PROCESS_TERMINATION';
					}
				}
				return {
					type: termType,
					hadUnload: hadUnload,
					lastHeartbeatTime: lastHbTime,
					deltaToInitMs: hbDeltaToInit,
					alivePostMilestoneMs: alivePostMilestone,
					lastMilestone: lastPrevM,
					heartbeatCount: prevHeartbeat ? prevHeartbeat.count : 0
				};
			}

			function recordDiagEvent(type, detail) {
				try {
					var entry = { type: type, time: Date.now(), detail: detail || {} };
					if (type.indexOf('milestone:') === 0) {
						lastRecordedMilestoneName = type;
						lastRecordedMilestoneTime = entry.time;
					}
					diagEvents.push(entry);
					if (diagEvents.length > 50) diagEvents.shift();
					if (window.__4TM_DIAG__) {
						window.__4TM_DIAG__.events = diagEvents;
						window.__4TM_DIAG__.lastEvent = entry;
					}
					saveDiagHistory();
					if (isDiagActive && typeof updateDiagUI === 'function') {
						updateDiagUI();
					}
				} catch (e) {}
			}

			function recordDiagError(type, message, details) {
				try {
					var entry = {
						type: type,
						message: String(message || 'Unknown error'),
						time: Date.now(),
						details: details || {}
					};
					diagErrors.push(entry);
					if (diagErrors.length > 30) diagErrors.shift();
					var eventEntry = {
						type: 'error:' + type,
						time: entry.time,
						detail: { message: entry.message, details: details || {} }
					};
					diagEvents.push(eventEntry);
					if (diagEvents.length > 50) diagEvents.shift();
					if (window.__4TM_DIAG__) {
						window.__4TM_DIAG__.errors = diagErrors;
						window.__4TM_DIAG__.lastError = entry;
						window.__4TM_DIAG__.events = diagEvents;
						window.__4TM_DIAG__.lastEvent = eventEntry;
					}
					saveDiagHistory();
					if (isDiagActive && typeof updateDiagUI === 'function') {
						updateDiagUI();
					}
				} catch (e) {}
			}

			window.__4TM_RECORD_MILESTONE__ = function (name, details) {
				recordDiagEvent('milestone:' + name, details);
			};

			window.__4TM_RECORD_ERROR__ = function (type, message, details) {
				recordDiagError(type, message, details);
			};

			recordDiagEvent('init', { referrer: document.referrer || '', userAgent: navigator.userAgent });

			// Intercept console.error to capture runtime / engine / WebGL errors
			(function () {
				var origConsoleError = console.error;
				var inConsoleError = false;
				console.error = function () {
					if (!inConsoleError) {
						inConsoleError = true;
						try {
							var args = Array.prototype.slice.call(arguments);
							var msg = args.map(function (a) {
								if (a instanceof Error) return a.message + (a.stack ? '\n' + a.stack : '');
								if (typeof a === 'object') {
									try { return JSON.stringify(a); } catch (e) { return String(a); }
								}
								return String(a);
							}).join(' ');
							if (msg.indexOf('[4TM-DIAG]') === -1) {
								recordDiagError('console_error', msg);
							}
						} catch (e) {}
						inConsoleError = false;
					}
					origConsoleError.apply(console, arguments);
				};
			})();

			// 1. Record browser page lifecycle events
			window.addEventListener('pagehide', function (e) {
				recordDiagEvent('pagehide', { persisted: !!e.persisted });
			});
			window.addEventListener('pageshow', function (e) {
				recordDiagEvent('pageshow', { persisted: !!e.persisted });
			});
			window.addEventListener('beforeunload', function () {
				recordDiagEvent('beforeunload', {});
			});
			window.addEventListener('unload', function () {
				recordDiagEvent('unload', {});
			});
			window.addEventListener('error', function (e) {
				var msg = (e.error && (e.error.message || e.error.stack)) || e.message || 'Script error';
				recordDiagError('uncaught_error', msg, { filename: e.filename, lineno: e.lineno, colno: e.colno });
			});
			window.addEventListener('unhandledrejection', function (e) {
				var r = e.reason ? (e.reason.message || e.reason.stack || e.reason) : 'Unhandled rejection';
				recordDiagError('unhandled_rejection', String(r), {});
			});
			document.addEventListener('visibilitychange', function () {
				recordDiagEvent('visibilitychange', { state: document.visibilityState });
				if (window.__4TM_DIAG__) {
					window.__4TM_DIAG__.visibilityState = document.visibilityState;
				}
			});

			// 2. Monitor WebGL context loss and restoration without forcing page reload
			function setupCanvasDiag() {
				var cv = document.getElementById('canvas');
				if (!cv) return;
				cv.addEventListener('webglcontextlost', function (e) {
					webglStats.lossCount++;
					webglStats.lastLossTime = Date.now();
					webglStats.isLost = true;
					recordDiagError('webglcontextlost', 'WebGL context lost (count: ' + webglStats.lossCount + ')', { lossCount: webglStats.lossCount });
				}, false);
				cv.addEventListener('webglcontextrestored', function (e) {
					webglStats.restoreCount++;
					webglStats.lastRestoreTime = Date.now();
					webglStats.isLost = false;
					recordDiagEvent('webglcontextrestored', { restoreCount: webglStats.restoreCount });
				}, false);
			}
			if (document.readyState === 'loading') {
				document.addEventListener('DOMContentLoaded', setupCanvasDiag);
			} else {
				setupCanvasDiag();
			}

			function updateDiag() {
				var probe = document.getElementById('gd-vh-probe');
				var ins = document.getElementById('gd-ins-probe');
				var canvas = document.getElementById('canvas');
				var winH = window.innerHeight || 0;
				var winW = window.innerWidth || 0;
				var docH = (document.documentElement && document.documentElement.clientHeight) || 0;
				var vvH = (window.visualViewport && Math.round(window.visualViewport.height)) || 0;
				var probeH = (probe && (probe.offsetHeight || (probe.getBoundingClientRect && Math.round(probe.getBoundingClientRect().height)))) || 0;
				var scrH = (window.screen && window.screen.height) || 0;
				var isStandalone = !!(window.navigator && window.navigator.standalone);
				var displayModeStandalone = window.matchMedia && window.matchMedia('(display-mode: standalone)').matches;
				var insetT = 0, insetB = 0;
				if (ins) {
					var cs = window.getComputedStyle(ins);
					insetT = parseFloat(cs.paddingTop) || 0;
					insetB = parseFloat(cs.paddingBottom) || 0;
				}
				var csw = canvas ? canvas.style.width : 'N/A';
				var csh = canvas ? canvas.style.height : 'N/A';
				var cw = canvas ? canvas.width : 'N/A';
				var ch = canvas ? canvas.height : 'N/A';
				var modeStr = isStandalone ? 'PWA-STANDALONE' : (displayModeStandalone ? 'STANDALONE-MEDIA' : 'SAFARI-WEB');
				window.__4TM_DIAG__ = {
					build: '2026.10.26-diag-v1',
					mode: modeStr,
					url: window.location.href,
					isDiagActive: isDiagActive,
					sessionCount: sessionCount,
					winH: winH, winW: winW, docH: docH, vvH: vvH, probeH: probeH, scrH: scrH,
					insetTop: insetT, insetBottom: insetB,
					visibilityState: document.visibilityState,
					canvasStyle: { width: csw, height: csh },
					canvasPixels: { width: cw, height: ch },
					webgl: webglStats,
					events: diagEvents,
					errors: diagErrors,
					prevSessionEvents: prevSessionEvents,
					prevSessionErrors: prevSessionErrors,
					prevSessionLastUpdated: prevSessionLastUpdated
				};
				if (isDiagActive && typeof updateDiagUI === 'function') {
					updateDiagUI();
				}
			}
			window.addEventListener('resize', updateDiag);
			window.addEventListener('orientationchange', updateDiag);
			updateDiag();

			function generateReportText() {
				var lines = [];
				lines.push('=== 4TM BLOCK PUZZLE DIAGNOSTIC REPORT ===');
				lines.push('Generated: ' + new Date().toISOString());
				lines.push('URL: ' + window.location.href);
				lines.push('Session Count: ' + sessionCount);
				lines.push('User Agent: ' + navigator.userAgent);
				var d = window.__4TM_DIAG__ || {};
				lines.push('Mode: ' + (d.mode || 'N/A'));
				lines.push('Viewport: win=' + (d.winW || window.innerWidth) + 'x' + (d.winH || window.innerHeight) +
					' vvH=' + (d.vvH || 0) + ' docH=' + (d.docH || 0) + ' scrH=' + (d.scrH || 0) +
					' insets(T=' + (d.insetTop || 0) + ', B=' + (d.insetBottom || 0) + ')');
				lines.push('WebGL: lossCount=' + webglStats.lossCount + ' restoreCount=' + webglStats.restoreCount + ' isLost=' + webglStats.isLost);
				var term = getTerminationAnalysis();
				lines.push('');
				lines.push('--- PREVIOUS SESSION TERMINATION ANALYSIS ---');
				lines.push('Termination Status: ' + term.type);
				lines.push('Clean Page Unload Fired: ' + (term.hadUnload ? 'YES (clean unload recorded)' : 'NO (terminated silently without lifecycle unmount)'));
				if (term.lastHeartbeatTime > 0) {
					lines.push('Last Alive Heartbeat: ' + formatTime(term.lastHeartbeatTime) + ' (~' + term.deltaToInitMs + 'ms before next session init)');
					if (term.lastMilestone && term.alivePostMilestoneMs > 0) {
						lines.push('Alive Duration After ' + term.lastMilestone.type + ': +' + term.alivePostMilestoneMs + 'ms');
					}
				}
				lines.push('');
				lines.push('--- PREVIOUS SESSION (BEFORE RELOAD) ---');
